process.roles=broker,controller
node.id=1
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600
log.dirs=/tmp/kafka-logs
num.partitions=1
num.recovery.threads.per.data.dir=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
controller.quorum.bootstrap.servers=127.0.0.1:9093
controller.quorum.voters=1@127.0.0.1:9093

log.dirs=/tmp/kraft-combined-logs

listeners=BROKER://:9092,CONTROLLER://:9093
advertised.listeners=BROKER://:9092
listener.security.protocol.map=BROKER:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
security.protocol=SASL_PLAINTEXT
sasl.enabled.mechanisms=PLAIN,GSSAPI

inter.broker.listener.name=BROKER
controller.listener.names=CONTROLLER

group.initial.rebalance.delay.ms=0
super.users=User:srv-kaf_07
listener.name.broker.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="kafka" password="kafka" user_kafka="kafka" user_writer="writer";
listener.name.broker.plain.sasl.client.callback.handler.class=com.teragrep.kaf_05.TeragrepAuthenticateCallbackHandler
listener.name.broker.plain.sasl.login.callback.handler.class=com.teragrep.kaf_05.TeragrepAuthenticateCallbackHandler
listener.name.broker.plain.sasl.server.callback.handler.class=com.teragrep.kaf_05.TeragrepAuthenticateCallbackHandler

listener.name.controller.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="kafka" password="kafka" user_kafka="kafka" user_writer="writer";
listener.name.controller.plain.sasl.client.callback.handler.class=com.teragrep.kaf_05.TeragrepAuthenticateCallbackHandler
listener.name.controller.plain.sasl.login.callback.handler.class=com.teragrep.kaf_05.TeragrepAuthenticateCallbackHandler
listener.name.controller.plain.sasl.server.callback.handler.class=com.teragrep.kaf_05.TeragrepAuthenticateCallbackHandler

sasl.enabled.mechanisms=PLAIN
sasl.mechanism.controller.protocol=PLAIN
sasl.mechanism.inter.broker.protocol=PLAIN
sasl.mechanism=PLAIN
